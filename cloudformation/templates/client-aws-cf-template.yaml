AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AKTO Amazon Quick processor. Deployed as a StackSet from the Organization management
  account, it places one Lambda per account and region that discovers Amazon Quick agents
  and MCP connectors and ingests their chat conversations into AKTO.

  No bucket name is configured anywhere: in 'discover' mode the Lambda reads the bucket
  straight off the account's existing CHAT_LOGS delivery, and in 'create' mode it
  provisions the bucket and the delivery itself. Checkpoints go to one central markers
  bucket in the management account, under <account-id>/<region>/.

  Deploy akto-markers-bucket.yaml as a plain stack in the management account FIRST, and
  pass its output as MarkersBucketName.

Parameters:
  MarkersBucketName:
    Type: String
    Description: >
      Name of the CENTRAL markers bucket, taken from the MarkersBucketName output of the
      akto-markers-bucket.yaml stack. Every processor writes its checkpoint there under
      <account-id>/<region>/, so one place holds the org-wide view of discovered agents,
      MCP connectors and last-processed timestamps.
    AllowedPattern: '^[a-z0-9\-\.]{3,63}$'
    ConstraintDescription: 'Must be the central markers bucket name'

  DataIngestionEndpoint:
    Type: String
    Description: 'AKTO Data Ingestion API endpoint URL (e.g. https://your-akto-instance.com/api/ingestData)'

  AktoApiKey:
    Type: String
    NoEcho: true
    Description: 'AKTO API Key for authentication'

  QuickLoggingMode:
    Type: String
    Description: >
      Is Quick chat logging ALREADY enabled in these accounts?
        discover - YES. The Lambda finds the existing CHAT_LOGS delivery and reads the
                   bucket straight off it. Bucket names may differ per account; nothing
                   is created and you supply no bucket name at all.
        create   - NO. The Lambda creates the bucket and enables logging itself, asking
                   for every record field including latency and time_to_first_token.
      'create' is safe on a mixed fleet: an account that already has a delivery is
      detected and left untouched rather than duplicated, and an account with no Quick
      Suite in this region has nothing created for it.
    Default: 'discover'
    AllowedValues: ['discover', 'create']

  QuickBucketBaseName:
    Type: String
    Description: >
      Required only when QuickLoggingMode is 'create'. Base name for the bucket the
      Lambda creates; the account id AND region are appended, because S3 bucket names are
      global and one account can run Quick in more than one region.
      'akto-quick-logs' becomes akto-quick-logs-041877753357-us-east-1.
    Default: ''
    AllowedPattern: '^$|^[a-z0-9\-\.]{3,40}$'
    ConstraintDescription: 'Must be a valid S3 bucket name prefix, or blank in discover mode'

  LambdaCodeVersion:
    Type: String
    Description: 'Version prefix in lambda-code-akto-<region> holding akto-quick-processor.zip (e.g. v2.0). The object must exist at that prefix before deploying.'
    Default: 'v1.0'
    AllowedPattern: '^v[0-9]+\.[0-9]+$'
    ConstraintDescription: 'Must be in format: v1.0, v1.1, v2.0, etc.'

Conditions:
  # The only conditional left. 'create' grants the permissions needed to make a bucket and
  # a delivery; in 'discover' mode those are withheld entirely and the Lambda only reads.
  QuickCreatesLogging: !Equals [!Ref QuickLoggingMode, 'create']

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'akto-quick-processor-${AWS::AccountId}-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: AktoQuickProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Central markers bucket in the management account. Scoped to this account's
              # own prefix, so a processor can never read or overwrite another account's
              # checkpoint even though every account shares the bucket.
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: !Sub 'arn:aws:s3:::${MarkersBucketName}/${AWS::AccountId}/*'
              - Effect: Allow
                Action: 's3:ListBucket'
                Resource: !Sub 'arn:aws:s3:::${MarkersBucketName}'
                Condition:
                  StringLike:
                    's3:prefix': !Sub '${AWS::AccountId}/*'

              # Quick chat logs. The bucket is discovered at runtime and its name is
              # unknown at deploy time, so this is scoped by KEY rather than by bucket:
              # Quick always writes under AWSLogs/<account-id>/, so the Lambda can read its
              # own account's log objects in whichever bucket the delivery points at, and
              # nothing else.
              - Effect: Allow
                Action: 's3:GetObject'
                Resource: !Sub 'arn:aws:s3:::*/AWSLogs/${AWS::AccountId}/*'
              - Effect: Allow
                Action: 's3:ListBucket'
                Resource: 'arn:aws:s3:::*'
                Condition:
                  StringLike:
                    's3:prefix': 'AWSLogs/*'

              # Quick discovery and enrichment: agents, MCP connectors, and the identity
              # of the asking user. None support resource-level permissions.
              - Effect: Allow
                Action:
                  - 'quicksight:ListAgents'
                  - 'quicksight:DescribeAgent'
                  - 'quicksight:ListTagsForResource'
                  - 'quicksight:ListActionConnectors'
                  - 'quicksight:DescribeActionConnector'
                  - 'quicksight:DescribeUser'
                  - 'quicksight:ListIAMPolicyAssignmentsForUser'
                Resource: '*'

              # Read-only delivery lookup: this is how the log bucket is discovered, so
              # the operator never supplies a bucket name. Granted in both modes.
              - Effect: Allow
                Action:
                  - 'logs:DescribeDeliverySources'
                  - 'logs:DescribeDeliveries'
                  - 'logs:DescribeDeliveryDestinations'
                  - 'logs:GetDelivery'
                  - 'logs:GetDeliverySource'
                  - 'logs:GetDeliveryDestination'
                Resource: '*'

              # Resolves the attached policies of an IAM-federated Quick user, reported as
              # that caller's effective permissions.
              - Effect: Allow
                Action: 'iam:ListAttachedRolePolicies'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/*'

              # 'create' mode only: make the bucket and turn Quick logging on. Withheld
              # entirely in 'discover' mode, where the Lambda never mutates anything.
              - !If
                - QuickCreatesLogging
                - Effect: Allow
                  Action:
                    - 's3:CreateBucket'
                    - 's3:PutBucketPolicy'
                    - 's3:GetBucketPolicy'
                  Resource: !Sub 'arn:aws:s3:::${QuickBucketBaseName}-${AWS::AccountId}-*'
                - !Ref 'AWS::NoValue'
              - !If
                - QuickCreatesLogging
                - Effect: Allow
                  Action:
                    - 'logs:PutDeliverySource'
                    - 'logs:PutDeliveryDestination'
                    - 'logs:CreateDelivery'
                  Resource: '*'
                - !Ref 'AWS::NoValue'
              # Required by AWS before a CHAT_LOGS delivery source can be created for a
              # Quick account - easy to miss, and CreateDelivery fails without it.
              - !If
                - QuickCreatesLogging
                - Effect: Allow
                  Action: 'quicksight:AllowVendedLogDeliveryForResource'
                  Resource: !Sub 'arn:aws:quicksight:${AWS::Region}:${AWS::AccountId}:account/${AWS::AccountId}'
                - !Ref 'AWS::NoValue'

  AktoQuickProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'akto-quick-processor-${AWS::AccountId}-${AWS::Region}'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      Code:
        S3Bucket: !Sub 'lambda-code-akto-${AWS::Region}'
        S3Key: !Sub '${LambdaCodeVersion}/akto-quick-processor.zip'
      Environment:
        Variables:
          DATA_INGESTION_ENDPOINT: !Ref DataIngestionEndpoint
          AKTO_API_KEY: !Ref AktoApiKey
          MARKERS_BUCKET_NAME: !Ref MarkersBucketName
          QUICK_LOGGING_MODE: !Ref QuickLoggingMode
          QUICK_BUCKET_BASE_NAME: !Ref QuickBucketBaseName
          QUICK_AWS_REGION: !Ref 'AWS::Region'
          AWS_ACCOUNT_ID: !Ref 'AWS::AccountId'
      Description: 'Discovers Amazon Quick agents and MCP connectors and sends their chat conversations to AKTO'

  EventBridgeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: AllowLambdaInvocation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: !GetAtt AktoQuickProcessorFunction.Arn

  QuickProcessorScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'akto-quick-schedule-${AWS::AccountId}-${AWS::Region}'
      # Keep in step with SCHEDULE_INTERVAL_MS in config.js, which derives the run budget
      # from it so a run always finishes before the next trigger fires.
      ScheduleExpression: 'rate(10 minutes)'
      State: ENABLED
      Description: 'Triggers the AKTO Amazon Quick processor on schedule'
      Targets:
        - Arn: !GetAtt AktoQuickProcessorFunction.Arn
          Id: AktoQuickProcessorTarget
          RoleArn: !GetAtt EventBridgeExecutionRole.Arn

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AktoQuickProcessorFunction
      Action: 'lambda:InvokeFunction'
      Principal: events.amazonaws.com
      SourceArn: !GetAtt QuickProcessorScheduleRule.Arn

Outputs:
  LambdaFunctionName:
    Description: 'Name of the processor Lambda'
    Value: !Ref AktoQuickProcessorFunction

  LoggingMode:
    Description: 'How this account obtains its Quick chat logs'
    Value: !If
      - QuickCreatesLogging
      - !Sub 'CREATE - will provision ${QuickBucketBaseName}-${AWS::AccountId}-${AWS::Region} and enable logging if absent'
      - 'DISCOVER - reads the bucket off the existing CHAT_LOGS delivery; nothing is created'

  MarkersLocation:
    Description: 'Where this account and region writes its checkpoint'
    Value: !Sub 's3://${MarkersBucketName}/${AWS::AccountId}/${AWS::Region}/'
